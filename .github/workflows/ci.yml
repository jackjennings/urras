name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.x
      - run: deno fmt --check
      - run: deno lint
      - name: Check conventional commits
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            commits=$(git log --no-merges --format="%H" origin/main..HEAD)
          else
            commits=$(git log --no-merges -1 --format="%H")
          fi
          for sha in $commits; do
            tmp=$(mktemp)
            git log -1 --format="%B" "$sha" > "$tmp"
            scripts/commit-lint.sh "$tmp"
            rm "$tmp"
          done
      - name: Check commits are signed
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            commits=$(git log --no-merges --format="%H" origin/main..HEAD)
          else
            commits=$(git log --no-merges -1 --format="%H")
          fi
          for sha in $commits; do
            status=$(git log -1 --format="%G?" "$sha")
            scripts/commit-signed.sh "$status" "$sha"
          done
      - run: deno task test
